  <div id="section-home" class="section">
    <div style="display: flex; justify-content: space-between; align-items: center; max-width: 400px; margin: 0 auto;"><h2 id="welcome-message" style="margin: 0;"></h2><button onclick="preparePinReset()" style="background:none; border:none; color:#2196F3; text-decoration:underline; cursor:pointer;">PINのへんこう</button></div>
    <div style="background: #222; padding: 20px; border-radius: 15px; max-width: 350px; margin: 20px auto;"><p style="margin:0; font-size:18px;">げんざいのポイント</p><div style="color: gold; font-size: 40px; font-weight: bold;"><span id="user-points">0</span> <span style="font-size:20px;">Pt</span></div></div>
    <div id="home-quiz-resume-panel" style="display:none; max-width:400px; margin:12px auto 0; background:#1E2A38; border:1px solid #2F4660; border-radius:12px; padding:12px;">
      <div style="font-weight:bold; color:#9ED0FF; margin-bottom:6px;">🛟 途中の学習があります</div>
      <div id="home-quiz-resume-text" style="font-size:13px; color:#cfd8dc; line-height:1.5;"></div>
      <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
        <button type="button" class="submit-btn btn-blue" style="flex:1; min-width:130px; margin:0;" onclick="resumeQuizFromDraft()">▶ 学習を復帰する</button>
        <button type="button" class="cancel-btn" style="flex:1; min-width:130px; margin:0;" onclick="discardQuizRecoveryDraft()">✖ 復帰データを消す</button>
      </div>
    </div>
    
    <div style="display: flex; flex-direction: column; align-items: center; margin-top: 30px;">
      <button class="menu-btn btn-red" onclick="loadEnglishMaterials(this)">英語の自由学習</button>
      <button type="button" class="menu-btn btn-kanji-learning-home" onclick="openKanjiLearningMenu()">漢字の自由学習</button>
      <p style="text-align:center;color:#888;font-size:13px;max-width:400px;margin:14px auto 0;line-height:1.45;">Drive にブックやシートを追加したあと一覧が古いときは、下のボタンで再取得できます。ホームを開いたときにも自動で照合します。</p>
      <p id="home-materials-sync-status" style="text-align:center;color:#8bc34a;font-size:13px;max-width:400px;margin:6px auto 0;min-height:1.3em;"></p>
      <button type="button" class="menu-btn btn-gray" onclick="refreshMaterialsManualFromHome(this)" style="margin-top:6px;width:auto;padding:10px 18px;font-size:15px;">📚 英語・漢字の教材一覧を更新</button>
      <button class="menu-btn btn-purple" onclick="openTrainingMenu()">🎯 特訓メニューへ</button>
      <button class="menu-btn btn-blue" onclick="loadExternalLearning(this)">📚 アプリ以外の勉強を記録</button>
      <button type="button" class="menu-btn btn-gray" style="margin-top:8px; font-size:15px; padding:12px 16px;" onclick="openParentAdminMenu()">⚙ おうちの人：管理メニュー</button>
      <hr style="border-color:#444; width: 90%; max-width:350px; margin: 15px 0;">
      <button class="menu-btn btn-orange" onclick="loadRewards(this)">🎁 けいひんを もらう</button>
      <button class="menu-btn btn-green" onclick="loadInventory(this)">🎒 もちもの（使う）</button>
      <button class="menu-btn btn-gray" onclick="clearAppCacheAndReload(this)" style="margin-top: 10px; width:auto; padding: 10px 20px; font-size:16px;">🔄 データを最新に更新</button>
      <button class="menu-btn btn-gray" onclick="logout()" style="margin-top: 20px; width:auto; padding: 10px 20px; font-size:16px;">ログアウト</button>
    </div>
    <div id="home-stopwatch" style="margin: 22px auto 0; max-width: 360px; background:#1f1f1f; border:1px solid #333; border-radius:12px; padding:14px;">
      <div id="home-stopwatch-normal">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
          <div style="font-weight:bold; color:#ccc;">⏱️ ストップウォッチ</div>
          <div id="home-sw-display" style="font-family:'Courier New', monospace; font-size:24px; color: #4CAF50;">00:00:00</div>
        </div>
        <div style="font-size:12px;color:#888;margin-top:6px;">最大1時間30分で自動リセット（アカウントごとに保存）</div>
        <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
          <button type="button" id="home-sw-start-btn" class="submit-btn btn-green" style="flex:1; min-width:120px;" onclick="startStopwatch('home')">開始</button>
          <button type="button" id="home-sw-stop-btn" class="cancel-btn" style="flex:1; min-width:120px;" onclick="stopStopwatch('home')">停止</button>
          <button type="button" id="home-sw-reset-btn" class="submit-btn btn-gray" style="flex:1; min-width:120px;" onclick="resetStopwatch('home')">リセット</button>
        </div>
      </div>
      <div id="home-reward-countdown" style="display:none;">
        <div style="font-weight:bold; color:#FFD54F;">🎫 ご褒美タイム</div>
        <div id="home-reward-countdown-name" style="font-size:15px;color:#ccc;margin-top:6px;"></div>
        <div id="home-reward-countdown-display" style="font-family:'Courier New', monospace; font-size:28px; color:#FFD54F; margin-top:8px;">00:00</div>
        <div style="font-size:12px;color:#888;margin-top:6px;">残り時間（ストップウォッチの代わりに表示）</div>
      </div>
    </div>
  </div>
