  <div id="section-kanji-practice" class="section" style="background:#ffffff;color:#222;min-height:100vh;">
    <div class="kanji-practice-vertical-head">
    <h1 class="kp-page-title">漢字練習・設定調整</h1>
    <button type="button" class="cancel-btn kanji-menu-back-btn" onclick="openKanjiLearningMenu()">漢字学習メニューにもどる</button>
    <p class="kp-page-lead">教材のセットから選ぶか、下の検索で学年をまたいで探せます。漢字をタップすると練習できます。</p>
    </div>
    <div class="kp-controls-row kp-browse-panel">
      <div class="kp-panel-heading">教材セットからえらぶ</div>
      <div class="kp-browse-selects">
        <select id="kp-book-select" onchange="kpOnBookChange()" aria-label="ブック"></select>
        <select id="kp-sheet-select" onchange="kpOnSheetChange()" aria-label="学年シート"></select>
        <select id="kp-set-select" onchange="kpOnSetChange()" aria-label="セット番号"></select>
      </div>
      <div id="kp-practice-status" class="kp-practice-status">教材を読み込み中...</div>
      <div id="kp-tile-grid" class="kp-tile-grid"></div>
    </div>
    <div class="kp-controls-row kp-search-panel">
      <div class="kp-panel-heading">漢字・よみでさがす（全学年）</div>
      <p class="kp-search-lead">ブック／シート／セットの選択とは別に、漢字や音訓（音読み・訓読み）で検索します。検索は学習セットと同じローカルキャッシュを使います。教材にない漢字でも、KanjiVG にあれば書いて練習できます。</p>
      <div class="kp-search-input-row">
        <input id="kp-search-input" type="search" enterkeyhint="search" placeholder="例：園　／　その　／　エン" oninput="onKpGlobalSearchInput()" autocomplete="off">
        <button type="button" class="kp-search-clear-btn" onclick="clearKpGlobalSearch()">クリア</button>
      </div>
      <div id="kp-search-status" class="kp-search-status" aria-live="polite"></div>
      <div id="kp-search-results" class="kp-search-results"></div>
    </div>
    <div class="kp-iframe-wrap">
      <div id="kp-iframe-slot-practice">
        <iframe id="kp-pro-frame" class="kp-pro-frame-practice" src="about:blank" title="Kanji Practice Pro" style="width:100%;min-height:520px;border:1px solid #ccd3db;border-radius:10px;background:#fff;"></iframe>
      </div>
    </div>
  </div>
