  <div id="section-dungeon" class="section" style="padding:0;background:#12111c;min-height:100vh;color:#eeece2;">
    
    <!-- 塔の選択画面 -->
    <div id="dungeon-tower-select" class="dungeon-wrap" style="padding:20px 14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <h1 class="dungeon-h1" style="font-size:24px;">🏰 挑戦する塔をえらぼう！</h1>
        <button type="button" class="dungeon-btn dungeon-home-btn" onclick="exitDungeonToHome()">🏠 ホーム</button>
      </div>
      <p style="color:var(--muted);font-size:14px;margin:0 0 16px;">
        塔によって出題される問題セット（単語・表現）や階数が変わるよ。好きな塔に挑戦しよう！
      </p>
      
      <div id="dungeon-tower-list" style="display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));">
        <!-- JSで塔カードが動的に生成される -->
      </div>
    </div>

    <!-- ダンジョン本編画面 -->
    <div id="dungeon-game-main" class="dungeon-wrap" style="display:none;padding:12px 14px;">
      <header class="dungeon-header">
        <div class="dungeon-title-row">
          <button type="button" class="dungeon-btn dungeon-home-btn" onclick="exitDungeonToHome()">🏠 ホーム</button>
          <button type="button" class="dungeon-btn dungeon-home-btn" style="background:#2b2942;" onclick="backToTowerSelect()">🏰 塔選択</button>
          <h1 class="dungeon-h1" id="dungeon-tower-title">単語迷宮<small id="dungeon-tower-subtitle">百階</small></h1>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          <div class="dungeon-best">この塔の記録 <b id="dungeon-best">—</b></div>
          <button type="button" class="dungeon-btn" style="font-size:12px;padding:4px 10px;min-height:30px;background:var(--gold);color:#000;font-weight:bold;" onclick="openDungeonMenu()">📋 メニュー</button>
        </div>
      </header>

      <div class="dungeon-app">
        <div class="dungeon-col" style="max-width:680px;margin:0 auto;width:100%;">
          <div class="dungeon-stagewrap">
            <div class="dungeon-window" id="dungeon-stage"></div>
            <div id="dungeon-fx"></div>
          </div>
          <div class="dungeon-window" id="dungeon-win"></div>
        </div>
      </div>
    </div>

    <!-- 冒険メニュー モーダル (ステータス・きろく・音声設定) -->
    <div id="dungeon-menu-modal" class="dungeon-modal-overlay" style="display:none;" onclick="handleDungeonMenuOverlayClick(event)">
      <div class="dungeon-window dungeon-menu-dialog" onclick="event.stopPropagation()">
        
        <!-- モーダルヘッダー -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:2px solid var(--line);padding-bottom:8px;">
          <h2 class="dungeon-h2" style="margin:0;font-size:17px;color:var(--gold);">📋 冒険メニュー</h2>
          <button type="button" class="dungeon-btn" style="min-height:30px;padding:2px 10px;font-size:12px;" onclick="closeDungeonMenu()">✕ とじる</button>
        </div>

        <!-- タブボタン -->
        <div class="dungeon-menu-tabs" style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
          <button type="button" id="dungeon-tab-btn-stat" class="dungeon-btn active" style="flex:1;min-width:100px;font-size:13px;" onclick="switchDungeonMenuTab('stat')">📊 ステータス</button>
          <button type="button" id="dungeon-tab-btn-log" class="dungeon-btn" style="flex:1;min-width:100px;font-size:13px;" onclick="switchDungeonMenuTab('log')">📜 きろく</button>
          <button type="button" id="dungeon-tab-btn-sound" class="dungeon-btn" style="flex:1;min-width:100px;font-size:13px;" onclick="switchDungeonMenuTab('sound')">🔊 音声・サウンド</button>
        </div>

        <!-- タブ内容1: ステータス -->
        <div id="dungeon-tab-panel-stat" class="dungeon-menu-panel">
          <dl class="dungeon-stat" id="dungeon-status"></dl>
        </div>

        <!-- タブ内容2: きろく -->
        <div id="dungeon-tab-panel-log" class="dungeon-menu-panel" style="display:none;">
          <div class="dungeon-log" id="dungeon-log" style="max-height:320px;overflow-y:auto;"></div>
        </div>

        <!-- タブ内容3: 音声・サウンド -->
        <div id="dungeon-tab-panel-sound" class="dungeon-menu-panel" style="display:none;">
          <div style="display:grid;gap:12px;">
            <div style="background:#1b1a2a;padding:12px;border-radius:6px;border:1px solid #333048;">
              <h3 style="margin:0 0 8px;font-size:14px;color:var(--gold);font-family:var(--game);">🔊 ミュート切り替え</h3>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                <button id="dungeon-seMute" class="dungeon-btn" type="button" aria-label="効果音のオン・オフ">🔊</button>
                <button id="dungeon-bgmMute" class="dungeon-btn" type="button" aria-label="BGMのオン・オフ">🎵</button>
                <span id="dungeon-seStat" style="font-size:12px;color:var(--muted);">効果音なし</span>
              </div>
            </div>

            <div style="background:#1b1a2a;padding:12px;border-radius:6px;border:1px solid #333048;">
              <h3 style="margin:0 0 6px;font-size:14px;color:var(--gold);font-family:var(--game);">📁 音声ファイルの取り込み</h3>
              <p style="font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.5;">
                端末内のフォルダまたは音声ファイルを指定して、BGM・効果音をダンジョンRPGに読み込めます。
              </p>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button id="dungeon-seDirBtn" class="dungeon-btn" type="button">📁 フォルダから音読込</button>
                <button id="dungeon-seFileBtn" class="dungeon-btn" type="button">🎶 ファイル選択</button>
                <input type="file" id="dungeon-seDir" webkitdirectory multiple hidden>
                <input type="file" id="dungeon-seFiles" accept="audio/*,.mp3,.m4a,.ogg,.wav" multiple hidden>
              </div>
            </div>
          </div>
        </div>

        <!-- フッター -->
        <div style="margin-top:16px;border-top:1px solid #333048;padding-top:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <div style="display:flex;gap:8px;">
            <button type="button" class="dungeon-btn" style="font-size:12px;padding:4px 8px;background:#2b2942;" onclick="backToTowerSelect(); closeDungeonMenu();">🏰 塔選択へ</button>
            <button type="button" class="dungeon-btn" style="font-size:12px;padding:4px 8px;" onclick="exitDungeonToHome(); closeDungeonMenu();">🏠 ホームへ</button>
          </div>
          <button type="button" class="dungeon-btn" style="background:var(--gold);color:#000;font-weight:bold;font-size:13px;padding:4px 14px;" onclick="closeDungeonMenu()">閉じる</button>
        </div>

      </div>
    </div>

  </div>
